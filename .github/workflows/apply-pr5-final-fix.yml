name: Apply PR5 Final Fix

on:
  push:
    branches:
      - feat/wechat-mobile-terminology-v01
    paths:
      - scripts/apply-pr5-final-fix.mjs
      - .github/workflows/apply-pr5-final-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-pr5-final-fix.mjs
      - run: node tests/report-summary-print-contract.mjs
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: preserve tied focus in summary and print brand"
          git push origin HEAD:feat/wechat-mobile-terminology-v01
