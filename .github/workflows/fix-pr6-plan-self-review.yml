name: Fix PR6 Plan Self Review

on:
  push:
    branches:
      - feat/backend-api-skeleton-v01
    paths:
      - scripts/fix-pr6-plan-self-review.mjs
      - .github/workflows/fix-pr6-plan-self-review.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-pr6-plan-self-review.mjs
      - name: Commit corrected plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-01-bsti-backend-api-skeleton-environment-config-plan.md
          git commit -m "docs: correct PR6 implementation plan self-review"
          git push origin HEAD:feat/backend-api-skeleton-v01
