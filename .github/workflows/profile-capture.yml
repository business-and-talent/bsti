name: BSTI contract tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/wechat-mobile-terminology-v01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic PR5 transformation
        run: node scripts/apply-pr5.mjs

      - name: Run frozen contract tests
        run: |
          node tests/wechat-mobile-terminology-contract.mjs
          node tests/p0-platform-foundation-contract.mjs
          node tests/profile-capture-static-contract.mjs
          node tests/report-v0441-static-contract.mjs
          node tests/report-v0441-cause-cost.mjs
          git diff --check

      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html report-usage.html tests docs/superpowers
          git diff --cached --quiet && exit 0
          git commit -m "fix: correct WeChat export and operating-system tension naming"
          git push origin HEAD:feat/wechat-mobile-terminology-v01
