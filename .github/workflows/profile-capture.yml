name: BSTI contract tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-founder-follow-up:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/wechat-mobile-terminology-v01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed changes
        run: node scripts/apply-pr5-followup.cjs

      - name: Verify reviewed changes
        run: |
          node tests/report-continuation-contract.mjs
          node tests/wechat-mobile-terminology-contract.mjs
          node tests/p0-platform-foundation-contract.mjs
          node tests/profile-capture-static-contract.mjs
          node tests/report-v0441-static-contract.mjs
          node tests/report-v0441-cause-cost.mjs
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: preserve report across browser handoff"
          git push origin HEAD:feat/wechat-mobile-terminology-v01
