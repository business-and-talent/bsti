name: PR6 Bootstrap Executable Mode

on:
  push:
    branches:
      - feat/backend-api-skeleton-v01
    paths:
      - backend/functions/bsti-api/scf_bootstrap
      - .github/workflows/pr6-bootstrap-mode.yml

permissions:
  contents: write

jobs:
  executable-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/backend-api-skeleton-v01
          fetch-depth: 0
      - run: chmod +x backend/functions/bsti-api/scf_bootstrap
      - name: Commit executable mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/functions/bsti-api/scf_bootstrap
          if git diff --cached --quiet; then
            echo "Executable mode already set"
          else
            git commit -m "fix: mark CloudBase bootstrap executable"
            git push origin HEAD:feat/backend-api-skeleton-v01
          fi
