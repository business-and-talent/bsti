name: PR6 Backend Skeleton RED

on:
  push:
    branches:
      - feat/backend-api-skeleton-v01
    paths:
      - tests/backend-api-skeleton-contract.mjs
      - .github/workflows/pr6-red.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/backend-api-skeleton-contract.mjs
