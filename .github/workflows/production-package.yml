name: BSTI Production Package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run production package contracts
        run: |
          node tests/production-package-contract.mjs
          node tests/production-submission-client-contract.mjs

      - name: Build disabled production package
        run: node scripts/build-production-package.mjs --output dist --source-commit "$GITHUB_SHA"

      - name: Upload disabled production package
        uses: actions/upload-artifact@v4
        with:
          name: bsti-production-ready-disabled
          path: dist
          retention-days: 7
