name: Assessment Submission Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submission-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run assessment submission contracts
        run: |
          node tests/assessment-submission-validation-contract.mjs
          node tests/assessment-submission-http-contract.mjs
          node tests/assessment-repository-contract.mjs
