name: Assessment Submission Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submission-contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bsti_contract
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependency
        run: npm install --prefix backend/functions/bsti-api --ignore-scripts --no-audit --no-fund

      - name: Run assessment submission contracts
        run: |
          node tests/assessment-submission-validation-contract.mjs
          node tests/assessment-submission-http-contract.mjs
          node tests/assessment-repository-contract.mjs
          node tests/backend-api-skeleton-contract.mjs
          node tests/mysql-schema-migration-contract.mjs

      - name: Install MySQL client
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq mysql-client
          fi

      - name: Apply BSTI migrations
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root bsti_contract < backend/database/migrations/0001_initial_bsti_schema.up.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root bsti_contract < backend/database/migrations/0002_add_submission_fingerprint.up.sql

          column_count="$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B bsti_contract -e "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='assessments' AND column_name='submission_fingerprint' AND character_maximum_length=64;")"
          test "$column_count" = "1"

          check_count="$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B bsti_contract -e "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema=DATABASE() AND table_name='assessments' AND constraint_name='chk_assessments_submission_fingerprint' AND constraint_type='CHECK';")"
          test "$check_count" = "1"

      - name: Verify assessment submission transaction
        env:
          BSTI_RUNTIME_ENV: development
          BSTI_SUBMISSION_ENABLED: 'true'
          BSTI_API_VERSION: v1
          BSTI_DB_HOST: 127.0.0.1
          BSTI_DB_PORT: '3306'
          BSTI_DB_NAME: bsti_contract
          BSTI_DB_USER: root
          BSTI_DB_PASSWORD: root
          BSTI_DB_CONNECTION_LIMIT: '2'
          PORT: '9001'
          BSTI_TEST_API_BASE_URL: http://127.0.0.1:9001
        run: |
          set -euo pipefail
          pushd backend/functions/bsti-api
          npm start > /tmp/bsti-submission-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9001/health > /tmp/bsti-submission-health.json; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat /tmp/bsti-submission-api.log
            exit 1
          fi

          node test/assessment-submission-mysql-integration.mjs
          kill "$api_pid"
          wait "$api_pid" || true
          trap - EXIT
          popd

      - name: Verify reversible migration chain
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root bsti_contract < backend/database/migrations/0002_add_submission_fingerprint.down.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root bsti_contract < backend/database/migrations/0001_initial_bsti_schema.down.sql

          remaining="$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B bsti_contract -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('schema_migrations','assessments','assessment_profile_snapshots','assessment_answers','assessment_research_consents');")"
          test "$remaining" = "0"

          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root bsti_contract < backend/database/migrations/0001_initial_bsti_schema.up.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root bsti_contract < backend/database/migrations/0002_add_submission_fingerprint.up.sql

          recreated="$(mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root -N -B bsti_contract -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN ('schema_migrations','assessments','assessment_profile_snapshots','assessment_answers','assessment_research_consents');")"
          test "$recreated" = "5"

          echo "Assessment submission MySQL migration chain: PASS"
