name: BSTI PR3 final browser evidence

on:
  push:
    branches:
      - feat/user-profile-capture-v01

permissions:
  contents: write

jobs:
  browser-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/user-profile-capture-v01
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium test runtime
        run: |
          mkdir -p /tmp/bsti-playwright /tmp/bsti-final-evidence
          cd /tmp/bsti-playwright
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run final browser acceptance flow
        run: |
          python3 -m http.server 4173 >/tmp/bsti-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          cat > /tmp/bsti-playwright/verify.cjs <<'JS'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1600 } });
            const page = await context.newPage();
            const evidence = { verifiedHead: process.env.GITHUB_SHA };

            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
            await page.screenshot({ path: '/tmp/bsti-final-evidence/01-startup-page.png', fullPage: true });

            evidence.startupTitle = await page.locator('h1').first().innerText();
            evidence.technicalNameVisible = await page.getByText('经营系统张力测量工具', { exact: true }).count();
            evidence.removedEligibilityControls = await page.locator('#eligibility-operating,#eligibility-decisions,#eligibility-six-months,#eligibility-reference,.confirmation-list').count();
            evidence.currentRoleLabel = await page.getByText('当前角色', { exact: true }).count();
            evidence.industryOptions = await page.locator('#profile-industry-code option').count();
            evidence.remainingCheckboxes = await page.locator('.consent-choice input[type="checkbox"]').count();
            if (evidence.technicalNameVisible !== 1) throw new Error('Technical name is not normalized');
            if (evidence.removedEligibilityControls !== 0) throw new Error('Removed eligibility controls are still present');
            if (evidence.currentRoleLabel !== 1) throw new Error('Current-role label is missing');
            if (evidence.industryOptions !== 15) throw new Error('Industry dropdown taxonomy changed unexpectedly');
            if (evidence.remainingCheckboxes !== 2) throw new Error('Unexpected consent checkbox count');

            const privacyPromise = context.waitForEvent('page');
            await page.getByRole('link', { name: '《BSTI 个人信息处理规则》' }).first().click();
            const privacyPage = await privacyPromise;
            await privacyPage.waitForLoadState('domcontentloaded');
            evidence.privacyUrl = privacyPage.url();
            evidence.privacyHeading = await privacyPage.locator('h1').innerText();
            evidence.privacyCurrentRole = await privacyPage.getByText(/当前角色/).count();
            evidence.privacyTechnicalName = await privacyPage.getByText(/经营系统张力测量工具/).count();
            evidence.privacyLegacyRoleTerm = await privacyPage.getByText(/经营身份/).count();
            evidence.privacyReturnLink = await privacyPage.getByRole('link', { name: '返回 BSTI 测试' }).count();
            if (!evidence.privacyUrl.endsWith('/privacy.html') || evidence.privacyReturnLink !== 1 || evidence.privacyCurrentRole < 1 || evidence.privacyTechnicalName < 1 || evidence.privacyLegacyRoleTerm !== 0) throw new Error('Privacy page verification failed');
            await privacyPage.screenshot({ path: '/tmp/bsti-final-evidence/02-privacy-page.png', fullPage: true });
            await privacyPage.close();

            const usagePromise = context.waitForEvent('page');
            await page.getByRole('link', { name: '《BSTI 测试与报告使用说明》' }).first().click();
            const usagePage = await usagePromise;
            await usagePage.waitForLoadState('domcontentloaded');
            evidence.reportUsageUrl = usagePage.url();
            evidence.reportUsageHeading = await usagePage.locator('h1').innerText();
            evidence.reportUsageCurrentRole = await usagePage.getByText(/当前角色/).count();
            evidence.reportUsageLegacyRoleTerm = await usagePage.getByText(/经营身份/).count();
            evidence.reportUsageReturnLink = await usagePage.getByRole('link', { name: '返回 BSTI 测试' }).count();
            if (!evidence.reportUsageUrl.endsWith('/report-usage.html') || evidence.reportUsageReturnLink !== 1 || evidence.reportUsageCurrentRole < 1 || evidence.reportUsageLegacyRoleTerm !== 0) throw new Error('Report-usage page verification failed');
            await usagePage.screenshot({ path: '/tmp/bsti-final-evidence/03-report-usage-page.png', fullPage: true });
            await usagePage.close();

            await page.getByLabel('姓名', { exact: true }).fill('浏览器验收用户');
            await page.getByLabel('公司／主要经营主体', { exact: true }).fill('万商万才');
            await page.getByLabel('当前角色', { exact: true }).selectOption('founder_controller');
            await page.getByLabel('年营收规模', { exact: true }).selectOption('prefer_not_to_say');
            await page.getByLabel('组织人数', { exact: true }).selectOption('prefer_not_to_say');
            await page.getByLabel('所属行业', { exact: true }).selectOption('professional_services');
            await page.locator('#consent-report-processing').check();
            await page.getByRole('button', { name: '确认资料，开始测试' }).click();

            await page.waitForSelector('.question-card');
            evidence.questionCountOnFirstPage = await page.locator('.question-card').count();
            evidence.firstQuestionNumber = await page.locator('.question-number').first().innerText();
            evidence.firstQuestionText = await page.locator('.question-card h2').first().innerText();
            evidence.progressText = await page.locator('.progress-copy').innerText();
            evidence.introVisibleAfterSubmit = await page.getByRole('button', { name: '开始作答' }).count();
            if (evidence.questionCountOnFirstPage !== 5 || evidence.firstQuestionNumber !== '01' || !evidence.progressText.includes('0／40') || evidence.introVisibleAfterSubmit !== 0) throw new Error('Direct assessment entry verification failed');
            await page.screenshot({ path: '/tmp/bsti-final-evidence/04-first-question-page.png', fullPage: true });

            const cards = page.locator('.question-card');
            for (let index = 0; index < 5; index += 1) await cards.nth(index).locator('.likert-option').nth(2).click();
            await page.getByRole('button', { name: '下一页' }).click();
            await page.waitForFunction(() => document.querySelector('.question-number')?.textContent?.includes('06'));
            evidence.secondPageFirstQuestionNumber = await page.locator('.question-number').first().innerText();
            await page.screenshot({ path: '/tmp/bsti-final-evidence/05-second-question-page.png', fullPage: true });

            await page.getByRole('button', { name: '上一页' }).click();
            await page.waitForFunction(() => document.querySelector('.question-number')?.textContent?.includes('01'));
            evidence.returnedFirstQuestionNumber = await page.locator('.question-number').first().innerText();
            if (evidence.secondPageFirstQuestionNumber !== '06' || evidence.returnedFirstQuestionNumber !== '01') throw new Error('Assessment navigation verification failed');

            fs.writeFileSync('/tmp/bsti-final-evidence/browser-evidence.json', JSON.stringify(evidence, null, 2));
            console.log(JSON.stringify(evidence, null, 2));
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
          GITHUB_SHA="$(git rev-parse HEAD)" node /tmp/bsti-playwright/verify.cjs

      - name: Upload final browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: bsti-pr3-final-browser-evidence
          path: /tmp/bsti-final-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/bsti-pr3-final-browser-evidence.yml
          git add .github/workflows/bsti-pr3-final-browser-evidence.yml
          git commit -m 'chore: remove final browser evidence workflow'
          git push origin HEAD:feat/user-profile-capture-v01
