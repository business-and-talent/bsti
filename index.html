<!doctype html><html lang='zh-Hans'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>:root {
  --purple: #7c3aed;
  --purple-dark: #6d28d9;
  --purple-soft: #f5f3ff;
  --ink: #202123;
  --muted: #6b7280;
  --line: #e5e7eb;
  --surface: #ffffff;
  --surface-soft: #f7f7f8;
  --shadow: 0 16px 48px rgba(32, 33, 35, 0.08);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: var(--surface);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; background: var(--surface); }
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .42; }
.loading { display:grid; place-items:center; min-height:100vh; color:var(--muted); }
.shell { width: min(100% - 40px, 1120px); margin: 0 auto; padding: 28px 0 96px; }
.shell--narrow { width: min(100% - 40px, 760px); }
.shell--review { width: min(100% - 40px, 860px); }
.brand-row { display:flex; align-items:center; gap:10px; min-height:36px; font-weight:650; letter-spacing:-.01em; }
.brand-dot { width:14px; height:14px; border-radius:50%; background:var(--purple); box-shadow:0 0 0 6px var(--purple-soft); }
.hero-card, .review-card { margin-top:54px; padding:44px; border:1px solid var(--line); border-radius:28px; box-shadow:var(--shadow); }
.eyebrow { color:var(--purple); text-transform:uppercase; letter-spacing:.08em; font-size:.78rem; font-weight:750; margin:0 0 14px; }
h1 { font-size:clamp(2rem, 5vw, 3.5rem); line-height:1.08; letter-spacing:-.045em; margin:0; }
.lead { margin:22px 0 0; font-size:1.08rem; line-height:1.8; color:#4b5563; }
.notice-list { display:grid; gap:0; margin:28px 0; border:1px solid var(--line); border-radius:18px; overflow:hidden; }
.notice-list div { display:grid; grid-template-columns:120px 1fr; gap:16px; padding:15px 18px; border-bottom:1px solid var(--line); }
.notice-list div:last-child { border-bottom:0; }
.notice-list strong { font-size:.9rem; }
.notice-list span { color:var(--muted); line-height:1.5; }
.field-label { display:block; margin:28px 0 9px; font-weight:650; }
.text-input { width:100%; min-height:52px; padding:0 16px; border:1px solid var(--line); border-radius:14px; outline:none; transition:.2s; }
.text-input:focus { border-color:var(--purple); box-shadow:0 0 0 4px var(--purple-soft); }
.check-row { display:flex; gap:12px; align-items:flex-start; margin:20px 0 28px; color:#4b5563; line-height:1.6; }
.check-row input { width:18px; height:18px; margin-top:4px; accent-color:var(--purple); }
.button { min-height:48px; padding:0 20px; border-radius:14px; border:1px solid transparent; font-weight:680; transition:transform .15s, background .15s, border-color .15s; }
.button:not(:disabled):active { transform:translateY(1px); }
.button--primary { background:var(--purple); color:#fff; }
.button--primary:hover:not(:disabled) { background:var(--purple-dark); }
.button--secondary { background:#fff; border-color:var(--line); color:var(--ink); }
.button--full { width:100%; }
.footnote { margin:24px 12px 0; color:var(--muted); font-size:.88rem; line-height:1.6; text-align:center; }
.instruction-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:32px 0; }
.instruction-grid > div { padding:18px; background:var(--surface-soft); border-radius:16px; }
.instruction-grid p { margin:14px 0 0; color:#4b5563; line-height:1.6; font-size:.93rem; }
.step-number { color:var(--purple); font-weight:760; }
.assessment-shell { width:min(100% - 40px, 900px); padding-bottom:calc(164px + env(safe-area-inset-bottom)); scroll-padding-bottom:calc(164px + env(safe-area-inset-bottom)); }
.assessment-header { position:sticky; top:0; z-index:10; padding:22px 0 18px; background:rgba(255,255,255,.94); backdrop-filter:blur(14px); }
.progress-copy { display:flex; justify-content:space-between; align-items:center; margin:25px 0 9px; color:var(--muted); font-size:.9rem; }
.progress-copy strong { color:var(--ink); }
.progress-track { height:6px; border-radius:99px; overflow:hidden; background:#eeeef0; }
.progress-track span { display:block; height:100%; border-radius:inherit; background:var(--purple); transition:width .25s ease; }
.question-list { display:grid; gap:18px; margin:28px 0 0; }
.question-card { position:relative; padding:28px; border:1px solid var(--line); border-radius:22px; background:#fff; }
.question-number { color:var(--purple); font-size:.76rem; font-weight:760; letter-spacing:.1em; }
.question-card h2 { margin:10px 0 22px; font-size:1.12rem; line-height:1.65; letter-spacing:-.01em; }
.likert { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; padding:0; margin:0; border:0; }
.likert-option { min-height:86px; padding:12px 8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); border-radius:14px; text-align:center; color:var(--muted); transition:.18s; }
.likert-option:hover { border-color:#c4b5fd; background:#faf9ff; }
.likert-option.is-selected { border-color:var(--purple); color:var(--purple-dark); background:var(--purple-soft); box-shadow:0 0 0 2px rgba(124,58,237,.08); }
.likert-option input { position:absolute; opacity:0; pointer-events:none; }
.likert-number { font-weight:780; font-size:1.05rem; color:inherit; }
.likert-label { font-size:.78rem; line-height:1.25; }
.sticky-actions { position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:20; width:min(100%, 940px); min-height:82px; display:flex; justify-content:space-between; gap:14px; padding:16px 20px calc(16px + env(safe-area-inset-bottom)); background:rgba(255,255,255,.98); border-top:1px solid var(--line); box-shadow:0 -12px 30px rgba(32,33,35,.06); backdrop-filter:blur(14px); }
.sticky-actions .button { min-width:140px; }
.review-card { margin-top:42px; }
.page-status-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:30px 0; }
.page-status { padding:16px; border:1px solid var(--line); border-radius:14px; background:#fff; display:flex; justify-content:space-between; color:var(--muted); }
.page-status:hover { border-color:var(--purple); }
.page-status strong { color:var(--purple); }
.review-actions { display:flex; justify-content:flex-end; gap:12px; }
@media (max-width: 700px) {
  .shell, .shell--narrow, .assessment-shell, .shell--review { width:min(100% - 28px, 100%); padding-top:18px; }
  .hero-card, .review-card { margin-top:28px; padding:26px 20px; border-radius:22px; }
  h1 { font-size:2.25rem; }
  .notice-list div { grid-template-columns:1fr; gap:5px; }
  .instruction-grid { grid-template-columns:1fr; }
  .question-card { padding:22px 16px; border-radius:18px; }
  .likert { gap:6px; }
  .likert-option { min-height:78px; padding:9px 3px; }
  .likert-label { font-size:.68rem; }
  .assessment-shell { padding-bottom:18px; scroll-padding-bottom:24px; }
  .sticky-actions { position:static; left:auto; bottom:auto; transform:none; width:100%; min-height:0; margin:28px 0 0; padding:16px 0 calc(16px + env(safe-area-inset-bottom)); background:#fff; box-shadow:none; }
  .sticky-actions .button { flex:1; min-width:0; }
  .page-status-grid { grid-template-columns:repeat(2,1fr); }
  .review-actions { flex-direction:column-reverse; }
  .review-actions .button { width:100%; }
}

/* Results */
.result-shell { width:min(100% - 40px, 1180px); margin:0 auto; padding:24px 0 70px; }
.result-topbar { display:flex; justify-content:space-between; align-items:center; gap:20px; }
.topbar-actions { display:flex; gap:10px; }
.button--ghost { background:transparent; border-color:transparent; color:var(--muted); }
.report-section { margin-top:38px; }
.result-hero { display:grid; grid-template-columns:1.15fr .85fr; gap:28px; align-items:end; padding:34px 0 22px; border-bottom:1px solid var(--line); }
.result-hero h1 { font-size:clamp(2.2rem, 5vw, 4.2rem); }
.result-entity { color:var(--muted); margin:18px 0 0; }
.summary-panel { padding:26px; border:1px solid #ddd6fe; border-radius:22px; background:var(--purple-soft); }
.summary-kicker { color:var(--purple); font-size:.78rem; font-weight:760; letter-spacing:.08em; }
.summary-panel p { margin:10px 0 0; font-size:1.08rem; line-height:1.75; }
.visual-grid { display:grid; grid-template-columns:1.15fr .85fr; gap:18px; align-items:start; }
.visual-side { display:grid; gap:18px; }
.panel { padding:26px; border:1px solid var(--line); border-radius:22px; background:#fff; }
.panel-heading { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:18px; }
.panel-heading h2, .section-heading h2 { margin:0; font-size:1.35rem; letter-spacing:-.025em; }
.panel-heading .eyebrow, .section-heading .eyebrow { margin-bottom:7px; }
.method-note, .signal-count { color:var(--muted); font-size:.8rem; white-space:nowrap; }
.bstm-radar { width:100%; max-height:470px; display:block; }
.axis-cross { stroke:#ececf0; stroke-width:1; }
.radar-grid { fill:none; stroke:#e5e7eb; stroke-width:1; }
.radar-axis { stroke:#d7d7dd; stroke-width:1; }
.radar-shape { fill:rgba(124,58,237,.15); stroke:var(--purple); stroke-width:3; stroke-linejoin:round; }
.radar-node { fill:var(--purple); stroke:#fff; stroke-width:3; }
.radar-label { font-size:11px; font-weight:650; fill:#444; }
.radar-score { fill:var(--purple); font-size:12px; font-weight:760; }
.radar-scale-label { fill:#9ca3af; font-size:8px; font-weight:650; paint-order:stroke; stroke:#fff; stroke-width:3px; stroke-linejoin:round; }
.axis-label { fill:#9ca3af; font-size:9px; letter-spacing:.06em; }
.chart-caption { margin:0; color:var(--muted); font-size:.78rem; line-height:1.6; text-align:center; }
.tension-bars { display:grid; gap:20px; }
.comparison-bars { display:grid; gap:18px; }
.bar-copy { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:8px; }
.bar-copy span { font-size:.9rem; }
.bar-copy strong { font-size:.95rem; }
.bar-copy small { display:inline-block; min-width:30px; margin-left:12px; color:var(--muted); font-size:.72rem; text-align:right; }
.bar-track { height:10px; border-radius:999px; background:#eeeef1; overflow:hidden; }
.bar-track span { display:block; height:100%; border-radius:inherit; background:var(--purple); }
.panel--tension { background:#fff; }
.panel--comparison { background:var(--surface-soft); }
.score-axis { position:relative; height:20px; margin:10px 0 0; color:#9ca3af; font-size:.66rem; }
.score-axis::before { content:""; position:absolute; left:20%; right:0; top:2px; height:1px; background:#dedee4; }
.score-axis span { position:absolute; top:7px; transform:translateX(-50%); }
.score-axis span:last-child { transform:translateX(-100%); }
.comparison-row { display:grid; gap:9px; }
.comparison-copy { display:flex; justify-content:space-between; align-items:baseline; gap:14px; }
.comparison-copy > span { color:#4b5563; font-size:.88rem; }
.comparison-copy strong { font-size:.95rem; }
.comparison-copy small { margin-left:10px; color:var(--muted); font-size:.7rem; font-weight:600; }
.comparison-track { position:relative; height:18px; }
.comparison-track::before { content:""; position:absolute; left:20%; right:0; top:8px; height:2px; border-radius:999px; background:#dedee4; }
.comparison-leader-guide { position:absolute; top:1px; bottom:1px; width:1px; transform:translateX(-50%); background:rgba(124,58,237,.42); }
.comparison-marker { position:absolute; top:3px; width:12px; height:12px; transform:translateX(-50%); border:2px solid var(--purple); border-radius:50%; background:#fff; box-shadow:0 0 0 3px rgba(124,58,237,.08); }
.comparison-marker--leader { background:var(--purple); }

.signal-panel { background:#fcfbff; }
.signal-groups { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
.signal-group { padding:18px; background:#fff; border:1px solid #ede9fe; border-radius:16px; }
.signal-group h3 { margin:0 0 12px; font-size:.95rem; }
.signal-item { display:grid; grid-template-columns:52px 1fr; gap:10px; padding:12px 0; border-top:1px solid var(--line); }
.signal-item:first-of-type { border-top:0; padding-top:0; }
.signal-item span { color:var(--purple); font-weight:760; font-size:.75rem; }
.signal-item p { margin:0; line-height:1.6; color:#4b5563; font-size:.9rem; }
.empty-state { color:var(--muted); }
.section-heading { margin-bottom:18px; }
.quadrant-detail-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.quadrant-card { padding:24px; border:1px solid var(--line); border-radius:22px; background:#fff; }
.quadrant-card--leader { border-color:#c4b5fd; box-shadow:0 0 0 3px rgba(124,58,237,.06); }
.quadrant-card-head { display:flex; justify-content:space-between; gap:16px; }
.quadrant-card-head > strong { color:var(--purple); font-size:2rem; letter-spacing:-.04em; }
.quadrant-card-head > strong small { font-size:.75rem; color:var(--muted); }
.quadrant-code { display:inline-flex; min-width:36px; height:25px; padding:0 8px; align-items:center; justify-content:center; border-radius:999px; background:var(--purple-soft); color:var(--purple); font-weight:760; font-size:.75rem; }
.quadrant-card h3 { margin:12px 0 4px; }
.quadrant-card-head p { margin:0; color:var(--muted); font-size:.82rem; }
.quadrant-description { color:#4b5563; line-height:1.65; }
.detail-block { margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
.detail-block h4 { margin:0 0 9px; font-size:.9rem; }
.detail-block p, .detail-block li { color:#4b5563; line-height:1.6; font-size:.88rem; }
.detail-block ul { padding-left:18px; margin:0; }
.detail-block--contrast { background:#fafafa; margin:18px -8px -6px; padding:16px; border:0; border-radius:14px; }
.split-section { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.question-prompts { margin:0; padding-left:24px; }
.question-prompts li { padding:10px 0 14px 6px; line-height:1.65; border-bottom:1px solid var(--line); }
.question-prompts li:last-child { border-bottom:0; }
.observation-list { display:grid; gap:12px; }
.observation-card { display:grid; grid-template-columns:42px 1fr; gap:12px; padding:16px; background:var(--surface-soft); border-radius:16px; }
.observation-index { color:var(--purple); font-weight:760; }
.observation-card strong { color:var(--purple); font-size:.75rem; }
.observation-card p { margin:6px 0 9px; line-height:1.55; font-size:.9rem; }
.observation-object { display:block; margin:0 0 5px; color:var(--purple); font-size:.7rem; font-weight:760; letter-spacing:.06em; }
.observation-card small { display:block; color:var(--muted); line-height:1.6; }
.boundary-note { display:flex; gap:14px; padding:18px 22px; background:var(--surface-soft); border-radius:16px; color:#4b5563; }
.boundary-note p { margin:0; line-height:1.65; }
.boundary-icon { flex:0 0 26px; height:26px; display:grid; place-items:center; border-radius:50%; color:var(--purple); background:var(--purple-soft); font-weight:760; }
.report-footer { margin-top:34px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:.78rem; text-align:center; }
@media (max-width: 860px) {
  .result-shell { width:min(100% - 28px, 100%); }
  .result-hero, .visual-grid, .split-section { grid-template-columns:1fr; }
  .result-hero { align-items:start; }
  .quadrant-detail-grid { grid-template-columns:1fr; }
}
@media (max-width: 620px) {
  .result-topbar { align-items:flex-start; }
  .topbar-actions { flex-direction:column; }
  .topbar-actions .button { min-height:40px; padding:0 12px; font-size:.8rem; }
  .result-hero { margin-top:18px; padding-top:18px; }
  .summary-panel, .panel, .quadrant-card { padding:20px 16px; border-radius:18px; }
  .signal-groups { grid-template-columns:1fr; }
  .bstm-radar { margin:0 -8px; width:calc(100% + 16px); }
}
@media print {
  @page { size:A4; margin:13mm; }
  body { background:#fff; }
  .no-print { display:none !important; }
  .result-shell { width:100%; padding:0; }
  .report-section { break-inside:avoid; margin-top:18px; }
  .panel, .quadrant-card, .summary-panel { box-shadow:none; }
  .result-hero { margin-top:0; }
  .visual-grid, .split-section, .quadrant-detail-grid { gap:10px; }
}

e_scale_id": "LIKERT_1_5", "required": true}, {"id": "I-06", "order": 6, "quadrant_id": "I", "content_block_id": "I-B", "text": "客户或市场的反应跟预期不一样时，我会先用过去有效的那套经验来解释。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "I-07", "order": 7, "quadrant_id": "I", "content_block_id": "I-B", "text": "已经决定先不做的机会，之后我还是会拿出来再想“会不会错过什么”。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "I-08", "order": 8, "quadrant_id": "I", "content_block_id": "I-B", "text": "听到和我原来判断不一样的信息时，我第一反应会是“我们的情况不一样”。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "I-09", "order": 9, "quadrant_id": "I", "content_block_id": "I-C", "text": "连续高强度工作一段时间后，我才会注意到自己又进入了停不下来的状态。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "I-10", "order": 10, "quadrant_id": "I", "content_block_id": "I-C", "text": "即使感觉到自己在着急，我还是会很快做出决定。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-01", "order": 11, "quadrant_id": "WE", "content_block_id": "WE-A", "text": "开会时，我或资深主管先表态后，后面的发言会围绕这个方向。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-02", "order": 12, "quadrant_id": "WE", "content_block_id": "WE-A", "text": "一个新的做法被认为风险比较大后，团队就会减少对它的讨论。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-03", "order": 13, "quadrant_id": "WE", "content_block_id": "WE-A", "text": "团队里有人质疑现有做法时，讨论会转到他的态度或配合度上。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-04", "order": 14, "quadrant_id": "WE", "content_block_id": "WE-A", "text": "讨论要不要改变做法时，听到“这行没人这么做”或“我们一直都是这样”，会让讨论停下来。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-05", "order": 15, "quadrant_id": "WE", "content_block_id": "WE-B", "text": "我会在散会后或私下，才听到会上没有出现的不同意见。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-06", "order": 16, "quadrant_id": "WE", "content_block_id": "WE-B", "text": "一个新想法还说不清能不能成时，讨论就会回到大家熟悉的做法。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-07", "order": 17, "quadrant_id": "WE", "content_block_id": "WE-B", "text": "影响经营的不利消息，会到问题扩大后才进入正式讨论。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-08", "order": 18, "quadrant_id": "WE", "content_block_id": "WE-B", "text": "一个问题在私下被反复提到，到了正式会议上却没有被摆到台面上讨论。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-09", "order": 19, "quadrant_id": "WE", "content_block_id": "WE-C", "text": "讨论同一件事时，不同人说起来，却像是在讨论不同的问题。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "WE-10", "order": 20, "quadrant_id": "WE", "content_block_id": "WE-C", "text": "出现和原来判断对不上的情况时，团队会用“这次比较特殊”来解释。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-01", "order": 21, "quadrant_id": "IT", "content_block_id": "IT-A", "text": "团队负责的事情出了问题，我会自己接手处理。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-02", "order": 22, "quadrant_id": "IT", "content_block_id": "IT-A", "text": "工作交给团队后，我还是会自己动手处理其中的部分。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-03", "order": 23, "quadrant_id": "IT", "content_block_id": "IT-A", "text": "重要事情交出去后，还没等团队主动回报，我就会先去问进度。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-04", "order": 24, "quadrant_id": "IT", "content_block_id": "IT-A", "text": "同样的问题再次出现，最后还是由我来处理。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-05", "order": 25, "quadrant_id": "IT", "content_block_id": "IT-B", "text": "一天下来，我的时间会被会议、消息和临时插进来的事情切得零零碎碎。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-06", "order": 26, "quadrant_id": "IT", "content_block_id": "IT-B", "text": "一个紧急问题还没处理完，我又会被另一个紧急问题拉走。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-07", "order": 27, "quadrant_id": "IT", "content_block_id": "IT-B", "text": "原本排好要做的培养人、改善做法或新尝试，会因为眼前的事情而推迟。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-08", "order": 28, "quadrant_id": "IT", "content_block_id": "IT-B", "text": "一天里，需要我亲自确认或拍板的事情，会占去我不少注意力。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-09", "order": 29, "quadrant_id": "IT", "content_block_id": "IT-C", "text": "即使已经觉得累了，我还是会继续工作。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "IT-10", "order": 30, "quadrant_id": "IT", "content_block_id": "IT-C", "text": "连续忙了一段时间后，我需要比平时休息更久，才能把精力补回来。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-01", "order": 31, "quadrant_id": "ITs", "content_block_id": "ITs-A", "text": "客户或市场发生变化后，我们要等到生意受到影响，才会注意到。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-02", "order": 32, "quadrant_id": "ITs", "content_block_id": "ITs-B", "text": "外部的信息一多、变化一快，我就很难确定公司接下来该把重点放在哪里。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-03", "order": 33, "quadrant_id": "ITs", "content_block_id": "ITs-A", "text": "关键客户、渠道或供应方发生变化后，我们才发现很多经营环节都会跟着受到影响。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-04", "order": 34, "quadrant_id": "ITs", "content_block_id": "ITs-C", "text": "外部环境已经变了，公司还是按原来的计划往前走。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-05", "order": 35, "quadrant_id": "ITs", "content_block_id": "ITs-B", "text": "报表反映的情况，跟一线实际发生的情况对不上。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-06", "order": 36, "quadrant_id": "ITs", "content_block_id": "ITs-B", "text": "经营数字看起来在变好，公司整体的经营表现却没有跟着改善。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-07", "order": 37, "quadrant_id": "ITs", "content_block_id": "ITs-C", "text": "许多不同类型的关键事项，最后还是要等少数几个人决定。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-08", "order": 38, "quadrant_id": "ITs", "content_block_id": "ITs-C", "text": "有些项目或做法已经不再是经营重点，却还会继续占用公司资源。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-09", "order": 39, "quadrant_id": "ITs", "content_block_id": "ITs-C", "text": "客户或市场已经变了，公司还是把资源放在过去的经营重点上。", "response_scale_id": "LIKERT_1_5", "required": true}, {"id": "ITs-10", "order": 40, "quadrant_id": "ITs", "content_block_id": "ITs-A", "text"       const pages = paginateItems(instrument.items, 5);
